name: splitpay
description: SplitPay - Premium Expense Tracker
version: 1.0.9+10

publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Charts
  fl_chart: ^0.68.0

  # Animations
  flutter_animate: ^4.5.0

  # Typography
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  gap: ^3.0.1
  shimmer: ^3.0.0
  shared_preferences: ^2.3.2
  package_info_plus: ^8.0.0
  device_info_plus: ^11.0.0
  permission_handler: ^11.3.1
  flutter_sms_inbox: ^1.0.4

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.1

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.0

  # Monetization / Ads / Updates
  google_mobile_ads: ^9.0.0
  in_app_update_flutter: ^3.0.0

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^7.3.1

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Biometric authentication
  local_auth: ^2.3.0

  # Image
  cached_network_image: ^3.4.1

  # On-device OCR — powers the Bill Scan flow on transaction & expense sheets
  google_mlkit_text_recognition: ^0.15.1

  # QR code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0

  # Sharing & media
  share_plus: ^10.0.3
  image_picker: ^1.1.2

  # Home screen widgets
  home_widget: ^0.9.3

  # Data import (CSV) — used by Settings > Import Data
  file_picker: ^8.1.2
  csv: ^6.0.0
  path_provider: ^2.1.4

  # UPI payments (India only)
  upi_pro_sdk: ^0.1.0
  url_launcher: ^6.3.0

  # Icons
  font_awesome_flutter: ^11.0.0

  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4

  # Native iOS Liquid Glass tab bar (requires Xcode 26 beta to build for iOS)
  cupertino_native: ^0.1.1
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/app_icons/
    - assets/sample/
