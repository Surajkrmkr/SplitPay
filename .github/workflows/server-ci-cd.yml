name: Server CI/CD (Railway)

on:
  push:
    branches: [splitpay-BE-prod]
    paths:
      - "server/**"
      - ".github/workflows/server-ci-cd.yml"

concurrency:
  group: server-ci-cd-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

jobs:
  ci-build:
    name: Lint & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "server/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Check Code Formatting
        run: npx prettier --check "src/**/*.ts"

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build TypeScript
        run: npm run build

  deploy-to-railway:
    name: Deploy to Railway
    needs: ci-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/splitpay-BE-prod'
    runs-on: ubuntu-latest
    env:
      # Project token for Railway project "SplitPay", environment "production".
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.71.0

      # `railway up` skips files matched by .gitignore, and server/.gitignore
      # lists prisma/schema.prisma (tracked anyway), which the Docker build needs.
      # The runner's checkout is throwaway, so drop the ignore file here.
      - name: Drop .gitignore so the upload includes prisma/schema.prisma
        run: rm -f .gitignore

      - name: Deploy to Railway
        run: railway up --service api --environment production --ci
