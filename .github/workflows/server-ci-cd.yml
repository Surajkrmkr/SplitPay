name: Server CI/CD (DigitalOcean Droplet)

on:
  push:
    branches: [ splitpay-BE-prod ]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci-cd.yml'

concurrency:
  group: server-ci-cd-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

jobs:
  ci-build:
    name: Lint & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Check Code Formatting
        run: npx prettier --check "src/**/*.ts"

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build TypeScript
        run: npm run build

  deploy-to-droplet:
    name: Deploy to DigitalOcean Droplet
    needs: ci-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/splitpay-BE-prod'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /opt/apps/repos/SplitPay/server
            git pull origin splitpay-BE-prod
            docker compose up -d --build
