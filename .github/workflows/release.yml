name: Release to testing and production tracks

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platform(s) to build and upload"
        required: true
        default: both
        type: choice
        options:
          - both
          - android
          - ios
      track:
        description: "Target track for Play Store (Android)"
        required: true
        default: internal
        type: choice
        options:
          - internal
          - production
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.7"

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump Version in pubspec.yaml
        run: |
          CURRENT=$(grep "^version:" pubspec.yaml | sed 's/version: *//' | tr -d '\r')
          SEMVER=$(echo $CURRENT | cut -d'+' -f1)
          BUILD=$(echo $CURRENT | cut -d'+' -f2)
          MAJOR=$(echo $SEMVER | cut -d'.' -f1)
          MINOR=$(echo $SEMVER | cut -d'.' -f2)
          PATCH=$(echo $SEMVER | cut -d'.' -f3)
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))+$((BUILD + 1))"
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml
          echo "Bumped version: $CURRENT → $NEW_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push

  android:
    needs: bump-version
    if: ${{ github.event_name == 'push' || github.event.inputs.platforms == 'android' || github.event.inputs.platforms == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Resolve version name from pubspec.yaml
        id: version
        run: |
          echo "name=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build release App Bundle
        run: >
          flutter build appbundle --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ github.run_number }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: android

      - name: Decode Play Console service account key
        run: echo "${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON_BASE64 }}" | base64 --decode > android/play-service-account.json

      - name: Upload to Play Console
        working-directory: android
        env:
          PLAY_STORE_JSON_KEY_PATH: play-service-account.json
        run: bundle exec fastlane ${{ inputs.track || 'internal' }}

  ios:
    needs: bump-version
    if: ${{ github.event_name == 'push' || github.event.inputs.platforms == 'ios' || github.event.inputs.platforms == 'both' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Set up temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed 's/"//g')

      - name: Import distribution certificate
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm cert.p12

      - name: Decode App Store Connect API key
        run: echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode > AuthKey.p8

      - name: Resolve version name from pubspec.yaml
        id: version
        run: |
          echo "name=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)" >> "$GITHUB_OUTPUT"

      - name: Flutter build (no codesign)
        run: >
          flutter build ios --release --no-codesign
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ github.run_number }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Build & upload to TestFlight
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ../AuthKey.p8
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane beta
